name: CI

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "0 0 * * 0" # weekly

# Declared per job, never workflow-wide: build runs on pull_request and executes
# PR-supplied code, so inheriting a write-scoped token -- which checkout persists into the
# git config -- handed any same-repo branch PR the ability to push to main, and a push to
# main publishes a release.
permissions:
  contents: read

env:
  DOCKER_REPO: ghcr.io/discourse/prometheus_exporter

jobs:
  build:
    runs-on: ubuntu-latest
    name: Ruby ${{ matrix.ruby }} AR ${{ matrix.activerecord }}
    timeout-minutes: 10

    permissions:
      contents: read

    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/gemfiles/ar_${{ matrix.activerecord }}.gemfile

    strategy:
      fail-fast: false
      matrix:
        ruby: ["3.2", "3.3", "3.4", "4.0"]
        activerecord: [71, 72, 80, 81]

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1.324.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler: latest
          bundler-cache: true

      - name: Run tests
        run: bin/rake

  docker_build:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      # The image installs a published gem, so building it cannot exercise this branch's
      # code. This compares the image's Ruby against the gemspec floor directly, which is
      # what would have caught ruby:3.1-slim against a >= 3.2.0 requirement.
      - name: Image Ruby satisfies the gemspec floor
        run: |
          image_ruby=$(sed -n 's/^ARG RUBY_VERSION=//p' Dockerfile)
          floor=$(ruby -e 'print Gem::Specification.load("prometheus_exporter.gemspec").required_ruby_version.requirements.first.last.to_s')
          ruby -e 'abort "Dockerfile Ruby #{ARGV[0]} is below the gemspec floor #{ARGV[1]}" if Gem::Version.new(ARGV[0]) < Gem::Version.new(ARGV[1])' "$image_ruby" "$floor"

      # Built without pushing, so the Dockerfile is exercised before a release rather than
      # during one: the only run that touched it was the release itself, after the gem had
      # already been pushed to RubyGems. Both platforms, like publish_docker builds.
      - name: Build image without pushing
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          push: false
          platforms: linux/amd64,linux/arm64

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, docker_build]
    runs-on: ubuntu-latest

    permissions:
      contents: write

    outputs:
      new_version_published: ${{ steps.release.outputs.new_version }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Release gem
        id: release
        uses: discourse/publish-rubygems-action@ec5415e2cc3509a5cc8c4eef9499cf3fb05f8391 # v2
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
          GIT_EMAIL: team@discourse.org
          GIT_NAME: discoursebot

  publish_docker:
    needs: publish
    if: needs.publish.outputs.new_version_published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-qemu-action@2b82ce82d56a2a04d2637cd93a637ae1b359c0a7 # v2.2.0
      - uses: docker/setup-buildx-action@885d1462b80bc1c1c7f0b00334ad271f09369c55 # v2.10.0

      - name: Set vars
        id: vars
        run: |
          ruby -r ./lib/prometheus_exporter/version.rb -e 'print "version=#{PrometheusExporter::VERSION}"' >> $GITHUB_OUTPUT

      - name: Login to Github Container Registry
        uses: docker/login-action@465a07811f14bebb1938fbed4728c6a1ff8901fc # v2.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        uses: docker/build-push-action@1104d471370f9806843c095c1db02b5a90c5f8b6 # v3.3.1
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            GEM_VERSION=${{ steps.vars.outputs.version }}
          tags: |
            ${{ env.DOCKER_REPO }}:${{ steps.vars.outputs.version }}
            ${{ env.DOCKER_REPO }}:latest
